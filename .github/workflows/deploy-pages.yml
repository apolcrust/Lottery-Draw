name: Deploy Lottery Ball System to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # "/" for a user/organization site (USERNAME.github.io), "/REPOSITORY/" for a project site.
      PAGES_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
      VITE_LOTTERY_SUPABASE_URL: ${{ secrets.VITE_LOTTERY_SUPABASE_URL }}
      VITE_LOTTERY_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_LOTTERY_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Lottery Ball Supabase configuration
        run: |
          test -n "$VITE_LOTTERY_SUPABASE_URL" || (echo "Add VITE_LOTTERY_SUPABASE_URL as a repository Actions secret (Settings > Secrets and variables > Actions)." && exit 1)
          test -n "$VITE_LOTTERY_SUPABASE_PUBLISHABLE_KEY" || (echo "Add VITE_LOTTERY_SUPABASE_PUBLISHABLE_KEY as a repository Actions secret." && exit 1)
          case "$VITE_LOTTERY_SUPABASE_URL" in https://*.supabase.co|https://*.supabase.co/) ;; *) echo "VITE_LOTTERY_SUPABASE_URL must look like https://YOUR_PROJECT_ID.supabase.co"; exit 1;; esac
          case "$VITE_LOTTERY_SUPABASE_PUBLISHABLE_KEY" in sb_secret_*|eyJ*service_role*) echo "A secret/service_role key was supplied. Use only the PUBLISHABLE (anon) key."; exit 1;; esac
      - name: Run tests
        run: npm test
      - name: Build site
        run: npm run build -- --base="$PAGES_BASE_PATH"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
